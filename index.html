<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Profile Card</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <div class="profile-container">
      <div class="profile-card">
        <div class="profile-picture">
          <img src="img/profile 3.png" alt="Profile Picture" />
        </div>
        <div class="profile-name">
          <h1>Francis Ponce</h1>
        </div>
        <div class="role">
          <p>Graphic Artist | Front-End Developer Learner</p>
        </div>
        <div class="description">
          <p>
            Passionate about graphic design and currently building skills in
            front-end web development.
          </p>
        </div>
        <div class="contact">
          <a
            href="https://www.behance.net/francizponce"
            class="social-link"
            target="_blank"
            ><i class="bi bi-behance"></i
          ></a>
          <a
            href="https://www.linkedin.com/in/francis-ponce-b345b8312/"
            class="social-link"
            target="_blank"
            ><i class="bi bi-linkedin"></i
          ></a>
          <a href="FRANCIS PONCE (1).pdf" target="_blank" class="social-link"
            ><i class="bi bi-envelope-fill"></i
          ></a>
        </div>

        <button class="portfolio-btn"><a href="">View My Porfolio</a></button>
      </div>
    </div>
  </body>
</html>
